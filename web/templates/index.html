{#- Form-field helpers: every input gets a real <label for>, and hints are tied to their
    input with aria-describedby so screen readers read them. -#}
{% macro num(id, label, hint='', min=none, max=none, step=none, mode='numeric', unit=none, placeholder='') -%}
<div class="field">
  <label for="{{ id }}">{{ label|safe }}</label>
  {%- if unit %}<div class="input-group">{% endif %}
  <input type="number" id="{{ id }}"{% if min is not none %} min="{{ min }}"{% endif %}{% if max is not none %} max="{{ max }}"{% endif %}{% if step is not none %} step="{{ step }}"{% endif %}{% if mode %} inputmode="{{ mode }}"{% endif %}{% if placeholder %} placeholder="{{ placeholder }}"{% endif %}{% if hint %} aria-describedby="{{ id }}-hint"{% endif %}>
  {%- if unit %}<span class="input-addon unit-label">{{ unit }}</span></div>{% endif %}
  {%- if hint %}<p class="hint" id="{{ id }}-hint">{{ hint|safe }}</p>{% endif %}
</div>
{%- endmacro %}

{% macro text(id, label, hint='', placeholder='', upper=false, maxlength=none) -%}
<div class="field">
  <label for="{{ id }}">{{ label|safe }}</label>
  <input type="text" id="{{ id }}"{% if placeholder %} placeholder="{{ placeholder }}"{% endif %}{% if maxlength %} maxlength="{{ maxlength }}"{% endif %}{% if upper %} class="upper" autocapitalize="characters"{% endif %} spellcheck="false" autocomplete="off"{% if hint %} aria-describedby="{{ id }}-hint"{% endif %}>
  {%- if hint %}<p class="hint" id="{{ id }}-hint">{{ hint|safe }}</p>{% endif %}
</div>
{%- endmacro %}

{% macro secret(id, label, hint='') -%}
<div class="field">
  <label for="{{ id }}">{{ label|safe }}</label>
  <div class="input-group">
    <input type="password" id="{{ id }}" autocomplete="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-bwignore{% if hint %} aria-describedby="{{ id }}-hint"{% endif %}>
    <button type="button" class="input-addon addon-btn" data-action="eye" data-target="{{ id }}" aria-label="Show value" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg></button>
  </div>
  {%- if hint %}<p class="hint" id="{{ id }}-hint">{{ hint|safe }}</p>{% endif %}
</div>
{%- endmacro %}

{% macro toggle(id, label, desc) -%}
<div class="field">
  <span class="field-label" id="{{ id }}-label">{{ label }}</span>
  <label class="switch-field">
    <input type="checkbox" role="switch" id="{{ id }}" aria-labelledby="{{ id }}-label" aria-describedby="{{ id }}-desc">
    <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
    <span class="switch-desc" id="{{ id }}-desc">{{ desc }}</span>
  </label>
</div>
{%- endmacro %}

{% macro units(label) -%}
<div class="segmented" role="group" aria-label="{{ label }}">
  <button type="button" class="seg" data-action="unit" data-unit="ft" aria-pressed="true">ft</button>
  <button type="button" class="seg" data-action="unit" data-unit="m" aria-pressed="false">m</button>
  <button type="button" class="seg" data-action="unit" data-unit="km" aria-pressed="false">km</button>
</div>
{%- endmacro %}

{% macro ico(name, cls='icon') -%}
<svg class="{{ cls }}" aria-hidden="true"><use href="#i-{{ name }}"/></svg>
{%- endmacro %}

{% set tabs = [
  ('stats', 'Stats', 'chart'),
  ('map', 'Map', 'map'),
  ('apis', 'APIs', 'api'),
  ('rules', 'Rules', 'rules'),
  ('config', 'Settings', 'settings'),
  ('log', 'Log', 'log'),
] %}

{% set leagues = [
  ('NHL', 'nhl', 'https://api-web.nhle.com/v1/standings/now', 'NHL standings API'),
  ('NFL', 'nfl', 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams', 'ESPN NFL teams'),
  ('MLB', 'mlb', 'https://statsapi.mlb.com/api/v1/teams?sportId=1', 'MLB Stats API'),
  ('NBA', 'nba', 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams', 'ESPN NBA teams'),
  ('WNBA', 'wnba', 'https://site.api.espn.com/apis/site/v2/sports/basketball/wnba/teams', 'ESPN WNBA teams'),
  ('MLS', 'mls', 'https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/teams', 'ESPN MLS teams'),
  ('FIFA', 'fifa', 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/teams', 'ESPN World Cup teams'),
] %}

<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FlightTracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FlightTracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path fill='%234c9bff' d='M28 13.5c0-1.4-1.1-2.5-2.5-2.5H19L13 2H10l3 9H7L5 9H2l2 7-2 7h3l2-2h6l-3 9h3l6-9h6.5c1.4 0 2.5-1.1 2.5-2.5v-5z'/></svg>">
<script>

</script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>

  <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>

  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.5h.01"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5h.01"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 0 1-14.6 5.9L3.5 15.5M3.5 12A8.5 8.5 0 0 1 18.1 6.1l2.4 2.4"/><path d="M20.5 3.5v5h-5M3.5 20.5v-5h5"/></symbol>

<header class="appbar">
  <div class="brand">
    <span class="brand-mark">{{ ico('plane') }}</span>
    <span class="brand-name">Flight<b>Tracker</b></span>
  </div>

  <nav class="tabs" id="tabs" aria-label="Sections">
    {%- for key, label, icon in tabs %}
    <button type="button" class="tab" data-action="tab" data-tab="{{ key }}" aria-controls="{{ key }}-tab"{% if loop.first %} aria-current="page"{% endif %}>{{ ico(icon) }}<span>{{ label }}</span></button>
    {%- endfor %}
  </nav>

  <div class="appbar-actions">
    <span class="conn" id="conn-status" data-state="pending" title="Connecting to the Pi">
      <span class="conn-dot" aria-hidden="true"></span><span class="conn-label">Connecting</span>
    </span>
    <button type="button" class="icon-btn" id="theme-btn" data-action="theme" aria-label="Switch to light theme" title="Switch theme">
      {{ ico('sun', 'icon theme-icon-light') }}{{ ico('moon', 'icon theme-icon-dark') }}
    </button>
    <button type="button" class="icon-btn controls-btn" id="controls-btn" data-action="controls" aria-expanded="false" aria-controls="device-controls" aria-label="Display controls" title="Display controls">
      {{ ico('power') }}<span class="controls-dot" aria-hidden="true"></span>
    </button>

    <div class="device-controls" id="device-controls" data-ready="false" role="group" aria-label="Display controls">
      <p class="dc-title">Display controls</p>
      <button type="button" class="dswitch" id="display-toggle" role="switch" aria-checked="true" data-action="toggle-display" data-tone="ok" disabled
              title="Light or blank the LED matrix (the service keeps running)">
        <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
        <span class="dswitch-text"><span class="dswitch-name">Display</span><span class="dswitch-desc">Light or blank the LED matrix</span></span>
        <span class="dswitch-state" id="display-label">On</span>
      </button>
      <button type="button" class="dswitch" id="night-toggle" role="switch" aria-checked="false" data-action="toggle-night" data-tone="night" disabled
              title="Dim the display to night brightness without turning it off">
        <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
        <span class="dswitch-text"><span class="dswitch-name">Night</span><span class="dswitch-desc">Dim to night brightness</span></span>
        <span class="dswitch-state" id="night-label">Off</span>
      </button>
      <button type="button" class="dswitch" id="service-toggle" role="switch" aria-checked="true" data-action="toggle-service" data-tone="ok" disabled
              title="Stop or start the FlightTracker service (stops all API polling)">
        <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
        <span class="dswitch-text"><span class="dswitch-name">Service</span><span class="dswitch-desc">Stopping it halts all polling</span></span>
        <span class="dswitch-state" id="service-label">On</span>
      </button>
      <button type="button" class="dswitch" id="apis-toggle" role="switch" aria-checked="true" data-action="toggle-apis" data-tone="ok" data-off-tone="warn" disabled
              title="AirLabs and FlightAware lookups; off falls back to OpenSky and adsbdb">
        <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
        <span class="dswitch-text"><span class="dswitch-name">APIs</span><span class="dswitch-desc">AirLabs and FlightAware lookups</span></span>
        <span class="dswitch-state" id="apis-label">On</span>
      </button>
    </div>
  </div>
</header>

<main id="main">

  <!-- ═════════════════════════════ SETTINGS ═════════════════════════════ -->
  <section class="panel" id="config-tab" data-panel="config" aria-labelledby="config-title" hidden>
    <div class="page">
      <div class="page-head">
        <h1 class="page-title" id="config-title">Settings</h1>
        <p class="page-sub">Display, data sources and integrations. Changes apply when you save.</p>
      </div>

      <div class="banner banner-error" id="config-error" role="alert" hidden>
        {{ ico('alert') }}<span>Couldn't load settings from the Pi.</span>
        <button type="button" class="btn btn-secondary btn-sm" data-action="reload-config">{{ ico('refresh') }}Retry</button>
      </div>

      <div class="settings-layout">
        <nav class="section-index" id="section-index" aria-label="Settings sections">
          <button type="button" data-action="jump" data-target="sec-zone" class="is-active">Zone</button>
          <button type="button" data-action="jump" data-target="sec-altitude">Altitude</button>
          <button type="button" data-action="jump" data-target="sec-location">Location</button>
          <button type="button" data-action="jump" data-target="sec-display">Display</button>
          <button type="button" data-action="jump" data-target="sec-weather">Weather</button>
          <button type="button" data-action="jump" data-target="sec-scoreboard">Scoreboard</button>
          <button type="button" data-action="jump" data-target="sec-receiver">Receiver</button>
          <button type="button" data-action="jump" data-target="sec-keys">API keys</button>
          <button type="button" data-action="jump" data-target="sec-billing">Billing</button>
          <button type="button" data-action="jump" data-target="sec-cache">Cache</button>
        </nav>

        <form id="config-form" class="settings-form" autocomplete="off" novalidate>

          <section class="card" id="sec-zone" aria-labelledby="sec-zone-h">
            <header class="card-head">
              <div><h2 id="sec-zone-h">Zone boundaries</h2><p>Aircraft inside this box show on the display.</p></div>
              <button type="button" class="btn btn-secondary btn-sm" data-action="tab" data-tab="map">{{ ico('map') }}Edit on map</button>
            </header>
            <div class="fields fields-2">
              {{ num('zone_tl_y', 'Top-left latitude (N)', step='0.000001', mode=none) }}
              {{ num('zone_tl_x', 'Top-left longitude (W)', step='0.000001', mode=none) }}
              {{ num('zone_br_y', 'Bottom-right latitude (S)', step='0.000001', mode=none) }}
              {{ num('zone_br_x', 'Bottom-right longitude (E)', step='0.000001', mode=none) }}
            </div>
          </section>

          <section class="card" id="sec-altitude" aria-labelledby="sec-altitude-h">
            <header class="card-head">
              <div><h2 id="sec-altitude-h">Altitude filter</h2><p>Ignore aircraft outside this altitude band.</p></div>
              {{ units('Altitude units') }}
            </header>
            <div class="fields fields-2">
              {{ num('min_altitude', 'Minimum altitude', step='1', mode='decimal', unit='ft') }}
              {{ num('max_altitude', 'Maximum altitude', step='1', mode='decimal', unit='ft') }}
            </div>
          </section>

          <section class="card" id="sec-location" aria-labelledby="sec-location-h">
            <header class="card-head">
              <div><h2 id="sec-location-h">Home location</h2><p>Used for distances and local-airport fallbacks.</p></div>
              {{ units('Antenna altitude units') }}
            </header>
            <div class="fields fields-2">
              {{ num('loc_lat', 'Latitude', step='0.000001', mode=none) }}
              {{ num('loc_lon', 'Longitude', step='0.000001', mode=none) }}
              <div class="field">
                <label for="loc_alt" id="loc-alt-label">Antenna altitude (ft ASL)</label>
                <div class="input-group">
                  <input type="number" step="1" id="loc_alt" inputmode="decimal" aria-describedby="loc_alt-hint">
                  <span class="input-addon unit-label">ft</span>
                </div>
                <p class="hint" id="loc_alt-hint">Antenna height, for the distance calculation</p>
              </div>
              {{ text('timezone', 'Timezone', hint='IANA name, e.g. America/Los_Angeles &middot; <a href="https://en.wikipedia.org/wiki/List_of_tz_database_time_zones" target="_blank" rel="noopener">full list</a>', placeholder='America/Los_Angeles') }}
              {{ text('local_airports', 'Local airports', hint='Comma-separated codes used as an origin/destination fallback, e.g. LAS,VGT,HSH', placeholder='LAS,VGT,HSH', upper=true) }}
            </div>
          </section>

          <section class="card" id="sec-display" aria-labelledby="sec-display-h">
            <header class="card-head">
              <div><h2 id="sec-display-h">Display hardware</h2><p>LED matrix brightness, timing and labels.</p></div>
            </header>
            <div class="fields fields-3">
              {{ num('brightness', 'Brightness <span class="label-note">0&ndash;100</span>', min=0, max=100) }}
              {{ num('night_brightness', 'Night brightness <span class="label-note">0&ndash;100</span>', hint='Used while Night mode is on', min=0, max=100) }}
              {{ num('gpio_slowdown', 'GPIO slowdown', hint='Raise it if the display flickers', min=1, max=4) }}
              {{ text('journey_code', 'Journey code') }}
              {{ text('journey_blank', 'Journey blank filler') }}
              <div class="field">
                <label for="date_format">Date format</label>
                <select id="date_format">
                  <option value="MDY">M/D/YYYY (5/14/2026, US)</option>
                  <option value="DMY">D/M/YYYY (14/5/2026, UK/EU)</option>
                  <option value="YMD">YYYY-MM-DD (2026-05-14, ISO)</option>
                </select>
              </div>
              {{ toggle('hat_pwm', 'HAT PWM', 'Reduces flicker on some HATs') }}
              {{ toggle('loading_led_enabled', 'Loading LED', 'Physical LED lights while data loads') }}
              {{ num('loading_led_gpio_pin', 'Loading LED GPIO pin', hint='Default 25', min=1, max=40) }}
            </div>
          </section>

          <section class="card" id="sec-weather" aria-labelledby="sec-weather-h">
            <header class="card-head">
              <div><h2 id="sec-weather-h">Weather</h2><p>Temperature and rainfall on the idle screen.</p></div>
            </header>
            <div class="fields fields-2">
              {{ text('weather_location', 'Location', hint='e.g. spring%20valley,nv,us') }}
              <div class="field">
                <label for="temp_units">Units</label>
                <select id="temp_units">
                  <option value="imperial">Imperial (&deg;F)</option>
                  <option value="metric">Metric (&deg;C)</option>
                </select>
              </div>
              {{ secret('ow_key', 'OpenWeather API key') }}
              {{ toggle('rainfall_enabled', 'Rainfall', 'Show the rainfall overlay on the weather screen') }}
            </div>
          </section>

          <section class="card" id="sec-scoreboard" aria-labelledby="sec-scoreboard-h">
            <header class="card-head">
              <div><h2 id="sec-scoreboard-h">Scoreboard</h2><p>Live scores replace the idle screen while your teams play. Flights always take priority.</p></div>
            </header>

            <div class="live-game" id="sb-live-field" hidden>
              <span class="live-dot" id="sb-live-dot" aria-hidden="true"></span>
              <div class="live-game-text">
                <span class="live-game-kicker">On the board now</span>
                <span class="live-game-score" id="sb-live-text">&mdash;</span>
              </div>
              <button type="button" class="btn btn-secondary btn-sm" id="sb-hide-btn" data-action="hide-game">Hide this game</button>
              <p class="hint live-game-hint">Hiding swaps the scoreboard for the idle screen. It comes back on its own for the next game.</p>
            </div>

            <div class="fields">
              {{ toggle('scoreboard_enabled', 'Live scoreboard', 'Show live scores on the idle display when a followed team plays') }}
            </div>

            <div id="sb-body" hidden>
              <div class="subsection">
                <h3 class="subhead">Sports and teams</h3>
                <p class="hint">Top to bottom is priority order: drag a row, or use the arrows. Use the links to look up your team's numeric ID.</p>
                <table class="sb-table">
                  <thead>
                    <tr><th class="col-order"><span class="sr-only">Order</span></th><th>League</th><th>Follow</th><th>Team ID</th><th>Abbr <span class="label-note">max 4</span></th><th>Find team ID</th></tr>
                  </thead>
                  <tbody>
                    {%- for name, key, url, link in leagues %}
                    <tr draggable="true" data-league="{{ name }}">
                      <td class="col-order">
                        <span class="drag-handle" title="Drag to reorder">{{ ico('grip') }}</span>
                        <span class="move-btns">
                          <button type="button" class="icon-btn icon-btn-sm" data-action="sb-move" data-dir="-1" aria-label="Move {{ name }} up">{{ ico('up') }}</button>
                          <button type="button" class="icon-btn icon-btn-sm" data-action="sb-move" data-dir="1" aria-label="Move {{ name }} down">{{ ico('down') }}</button>
                        </span>
                      </td>
                      <td class="col-league"><span class="league league-{{ key }}">{{ name }}</span></td>
                      <td class="col-enable">
                        <label class="switch-field"><input type="checkbox" role="switch" id="sb_{{ key }}_enabled" aria-label="Follow {{ name }}"><span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span></label>
                      </td>
                      <td class="col-id"><input type="number" min="1" inputmode="numeric" id="sb_{{ key }}_team_id" aria-label="{{ name }} team ID" placeholder="ID"></td>
                      <td class="col-abbr"><input type="text" class="upper" maxlength="4" autocapitalize="characters" spellcheck="false" id="sb_{{ key }}_team_name" aria-label="{{ name }} team abbreviation" placeholder="ABBR"></td>
                      <td class="col-link"><a href="{{ url }}" target="_blank" rel="noopener" class="ext-link">{{ link }}{{ ico('external', 'icon icon-xs') }}</a></td>
                    </tr>
                    {%- endfor %}
                  </tbody>
                </table>
              </div>
              <div class="fields fields-3">
                {{ num('scoreboard_post_game_minutes', 'Post-game display <span class="label-note">minutes</span>', hint='How long the final score stays up after the game (0 hides it at once)', min=0, max=120) }}
                {{ num('scoreboard_goal_celebration_seconds', 'Score celebration <span class="label-note">seconds</span>', hint='How long the GOAL! / SCORE! scroll runs (0 turns it off). A flight overhead pauses it.', min=0, max=120) }}
                {{ num('scoreboard_win_celebration_seconds', 'Win celebration <span class="label-note">seconds</span>', hint='How long "TEAM WINS!" scrolls at the final horn (0 turns it off). Default 180.', min=0, max=600) }}
              </div>
            </div>
          </section>

          <section class="card" id="sec-receiver" aria-labelledby="sec-receiver-h">
            <header class="card-head">
              <div><h2 id="sec-receiver-h">Receiver</h2><p>Where live ADS-B positions come from.</p></div>
            </header>
            <div class="fields fields-2">
              {{ text('receiver_host', 'Receiver host', hint='IP of the fr24feed / dump1090 / VRS host. Add the port if it isn\'t standard, e.g. 192.168.1.50:8090') }}
              <div class="field">
                <label for="receiver_type">Receiver type</label>
                <select id="receiver_type" aria-describedby="receiver_type-hint">
                  <option value="dump1090">dump1090 / fr24feed (default)</option>
                  <option value="vrs">Virtual Radar Server (VRS)</option>
                </select>
                <p class="hint" id="receiver_type-hint">Pick VRS if Virtual Radar Server is your ADS-B source</p>
              </div>
              {{ num('poll_interval', 'Poll interval <span class="label-note">seconds</span>', hint='How often to check the receiver. Default 15. Lower finds flights sooner; higher saves CPU. Applies after Save &amp; restart.', min=5, max=120) }}
              {{ num('data_check_interval', 'Data check interval <span class="label-note">seconds</span>', hint='How quickly the display picks up finished lookups. Default 2. Applies after Save &amp; restart.', min=1, max=10) }}
            </div>
          </section>

          <section class="card" id="sec-keys" aria-labelledby="sec-keys-h">
            <header class="card-head">
              <div><h2 id="sec-keys-h">API keys</h2><p>Stored on the Pi. Masked here until you reveal them.</p></div>
            </header>
            <div class="fields fields-2">
              {{ secret('airlabs_key', 'AirLabs API key', hint='Free tier: 1,000 calls/month &middot; <a href="https://airlabs.co" target="_blank" rel="noopener">airlabs.co</a>') }}
              {{ secret('airlabs_key2', 'AirLabs API key 2 <span class="label-note">backup</span>', hint='Used automatically once key 1 hits its monthly limit') }}
              {{ secret('fa_key', 'FlightAware AeroAPI key', hint='$0.005 per call; the feeder credit applies') }}
              {{ text('opensky_id', 'OpenSky client ID', hint='Free with an account &middot; <a href="https://opensky-network.org" target="_blank" rel="noopener">opensky-network.org</a>') }}
              {{ secret('opensky_secret', 'OpenSky client secret') }}
            </div>
          </section>

          <section class="card" id="sec-billing" aria-labelledby="sec-billing-h">
            <header class="card-head">
              <div><h2 id="sec-billing-h">API billing</h2><p>Limits and reset days for the usage meters on the APIs page.</p></div>
            </header>
            <div class="fields fields-3">
              {{ num('feeder_monthly_credit', 'FlightAware feeder credit <span class="label-note">$/month</span>', hint='Default $10.00', min=0, step='0.01', mode='decimal') }}
              {{ num('aeroapi_reset_day', 'AeroAPI reset day', hint='Day of the month the FlightAware period resets (1&ndash;28)', min=1, max=28) }}
              {{ num('airlabs_monthly_limit', 'AirLabs monthly limit', hint='Free tier: 1,000 calls', min=1) }}
              {{ num('airlabs_reset_day', 'AirLabs reset day', hint='1&ndash;28', min=1, max=28) }}
              {{ num('airlabs2_monthly_limit', 'AirLabs 2 monthly limit', hint='Free tier: 1,000 calls', min=1) }}
              {{ num('airlabs2_reset_day', 'AirLabs 2 reset day', hint='1&ndash;28', min=1, max=28) }}
            </div>
          </section>

          <section class="card" id="sec-cache" aria-labelledby="sec-cache-h">
            <header class="card-head">
              <div><h2 id="sec-cache-h">Cache lifetimes</h2><p>In seconds. Applies after Save &amp; restart.</p></div>
            </header>
            <div class="fields fields-3">
              {{ num('adsbdb_cache_ttl', 'adsbdb', hint='Route results. Default 3600 (1 hour)', min=60) }}
              {{ num('opensky_cache_ttl', 'OpenSky', hint='Default 3600 (1 hour)', min=60) }}
              {{ num('route_ttl_scheduled', 'Scheduled routes', hint='Resolved airline routes. Default 604800 (7 days)', min=60) }}
              {{ num('route_ttl_default', 'GA and other routes', hint='GA, charter and unknown. Default 3600 (1 hour)', min=60) }}
              {{ num('route_miss_ttl', 'Miss retry', hint='Wait before re-asking an API that returned nothing. Default 300 (5 min)', min=30) }}
              {{ num('route_paid_miss_ttl', 'Paid miss suppression', hint='Skip AirLabs and AeroAPI after both came back empty. Default 7200 (2 hours)', min=60) }}
            </div>
          </section>

          <p class="credit">
            <a href="https://github.com/dalarso/FlightTracker" target="_blank" rel="noopener">github.com/dalarso/FlightTracker</a>
            &middot; based on <a href="https://github.com/ColinWaddell/FlightTracker" target="_blank" rel="noopener">Colin Waddell's FlightTracker</a>
          </p>
        </form>
      </div>
    </div>

    <div class="savebar" id="savebar" data-state="clean">
      <span class="save-status" id="save-status" role="status" aria-live="polite"></span>
      <div class="savebar-actions">
        <button type="button" class="btn btn-secondary" data-action="save-restart">{{ ico('refresh') }}<span>Save &amp; restart<span class="hide-sm"> display</span></span></button>
        <button type="button" class="btn btn-primary" data-action="save">{{ ico('check') }}Save</button>
      </div>
    </div>
  </section>

  <!-- ═════════════════════════════ MAP ═════════════════════════════ -->
  <section class="panel panel-full" id="map-tab" data-panel="map" aria-label="Zone map" hidden>
    <div class="map-wrap">
      <div id="map" aria-label="Zone map"></div>
      <div class="map-state" id="map-state" hidden></div>
      <div class="map-sheet">
        <div class="map-sheet-head">
          <h2>Zone bounds</h2>
          <button type="button" class="icon-btn" data-action="map-fit" aria-label="Fit the zone in view" title="Fit zone">{{ ico('target') }}</button>
        </div>
        <dl class="coords">
          <div><dt>N</dt><dd id="m-tl-y">&mdash;</dd></div>
          <div><dt>S</dt><dd id="m-br-y">&mdash;</dd></div>
          <div><dt>W</dt><dd id="m-tl-x">&mdash;</dd></div>
          <div><dt>E</dt><dd id="m-br-x">&mdash;</dd></div>
        </dl>
        <p class="hint">Drag the corner handles to resize the zone.</p>
        <div class="map-sheet-actions">
          <button type="button" class="btn btn-secondary" data-action="map-discard">Discard</button>
          <button type="button" class="btn btn-primary" data-action="map-save">{{ ico('check') }}Save zone</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ═════════════════════════════ APIS ═════════════════════════════ -->
  <section class="panel" id="apis-tab" data-panel="apis" aria-labelledby="apis-title" hidden>
    <div class="page">
      <div class="page-head">
        <h1 class="page-title" id="apis-title">APIs</h1>
        <p class="page-sub" id="apis-month">Loading usage&hellip;</p>
      </div>

      <div class="grid grid-3">
        {%- for key, prefix, title, sub in [('airlabs', 'al', 'AirLabs 1', 'Route data'), ('airlabs2', 'al2', 'AirLabs 2', 'Backup key')] %}
        <article class="card usage-card" id="usage-{{ key }}">
          <header class="card-head">
            <div><h2>{{ title }}</h2><p>{{ sub }}</p></div>
            <button type="button" class="btn btn-ghost btn-sm" data-action="adjust" data-api="{{ key }}">{{ ico('edit') }}Adjust</button>
          </header>
          <div class="meter-head"><span class="meter-big" id="{{ prefix }}-calls">&mdash;</span><span class="meter-unit">calls used</span><span class="meter-pct" id="{{ prefix }}-pct"></span></div>
          <div class="meter" role="presentation"><div class="meter-bar" id="{{ prefix }}-bar"></div></div>
          <dl class="kv">
            <div><dt>Remaining</dt><dd id="{{ prefix }}-remaining">&mdash;</dd></div>
            <div><dt>Period limit</dt><dd id="{{ prefix }}-limit">&mdash;</dd></div>
            <div><dt>Period</dt><dd id="{{ prefix }}-period">&mdash;</dd></div>
          </dl>
          <form class="adjust" id="adjust-{{ key }}" data-submit="adjust" data-api="{{ key }}" hidden>
            <label for="adjust-{{ key }}-val">Correct the call count for this period</label>
            <div class="inline-form">
              <input type="number" id="adjust-{{ key }}-val" min="0" step="1" inputmode="numeric" placeholder="calls used">
              <button type="submit" class="btn btn-primary btn-sm">Save</button>
              <button type="button" class="btn btn-ghost btn-sm" data-action="adjust" data-api="{{ key }}">Cancel</button>
            </div>
          </form>
        </article>
        {%- endfor %}
        <article class="card usage-card" id="usage-flightaware">
          <header class="card-head">
            <div><h2>FlightAware AeroAPI</h2><p>Paid lookups against the feeder credit</p></div>
            <button type="button" class="btn btn-ghost btn-sm" data-action="adjust" data-api="flightaware">{{ ico('edit') }}Adjust</button>
          </header>
          <div class="meter-head"><span class="meter-big" id="fa-spend">&mdash;</span><span class="meter-unit">est. spend</span><span class="meter-pct" id="fa-pct"></span></div>
          <div class="meter" role="presentation"><div class="meter-bar" id="fa-bar"></div></div>
          <dl class="kv">
            <div><dt>Est. calls</dt><dd id="fa-calls">&mdash;</dd></div>
            <div><dt>Monthly credit</dt><dd id="fa-credit">&mdash;</dd></div>
            <div><dt>Remaining</dt><dd id="fa-remaining">&mdash;</dd></div>
            <div><dt>Period</dt><dd id="fa-period">&mdash;</dd></div>
          </dl>
          <form class="adjust" id="adjust-flightaware" data-submit="adjust" data-api="flightaware" hidden>
            <label for="adjust-flightaware-val">Correct the spend ($) for this period</label>
            <div class="inline-form">
              <input type="number" id="adjust-flightaware-val" min="0" step="0.001" inputmode="decimal" placeholder="e.g. 4.253">
              <button type="submit" class="btn btn-primary btn-sm">Save</button>
              <button type="button" class="btn btn-ghost btn-sm" data-action="adjust" data-api="flightaware">Cancel</button>
            </div>
          </form>
        </article>
      </div>

      <section class="card" aria-labelledby="stack-h">
        <header class="card-head">
          <div><h2 id="stack-h">Route data stack</h2><p>Sources are tried in priority order until one returns a route.</p></div>
        </header>
        <div class="stack-list" id="stack-rows"><div class="empty">Loading&hellip;</div></div>
      </section>

      <section class="card" aria-labelledby="cache-entry-h">
        <header class="card-head">
          <div><h2 id="cache-entry-h">Clear one cache entry</h2><p>Drop a single aircraft type (by tail number) or route (by callsign) without wiping the whole cache.</p></div>
        </header>
        <form class="inline-form" data-submit="clear-cache-entry">
          <label for="cache-entry-input" class="sr-only">Tail number or callsign</label>
          <input type="text" id="cache-entry-input" class="upper mono" placeholder="N9003B or SWA1230" autocapitalize="characters" spellcheck="false" autocomplete="off" enterkeyhint="done">
          <button type="submit" class="btn btn-primary">{{ ico('trash') }}Clear entry</button>
        </form>
        <p class="form-result" id="cache-entry-result" role="status" aria-live="polite"></p>
      </section>
    </div>
  </section>

  <!-- ═════════════════════════════ STATS ═════════════════════════════ -->
  <section class="panel" id="stats-tab" data-panel="stats" aria-labelledby="stats-title">
    <div class="page">
      <div class="page-head page-head-split">
        <div>
          <h1 class="page-title" id="stats-title">Stats</h1>
          <p class="page-sub"><span id="stats-date">Today</span> <span class="updated" id="stats-updated" data-state="idle"></span></p>
        </div>
        <form class="search-bar" role="search" data-submit="stats-search">
          <label class="sr-only" for="stats-search-input">Search flight history</label>
          <span class="search-field">{{ ico('search') }}<input type="search" id="stats-search-input" class="mono" placeholder="Flight, tail or airport" autocapitalize="characters" spellcheck="false" autocomplete="off" enterkeyhint="search"></span>
          <button type="submit" class="btn btn-primary">Search</button>
        </form>
      </div>

      <article class="card" id="search-card" aria-labelledby="search-h" hidden>
        <header class="card-head">
          <div><h2 id="search-h">Search results</h2><p id="search-summary"></p></div>
          <button type="button" class="btn btn-ghost btn-sm" data-action="search-clear">{{ ico('x') }}Clear</button>
        </header>
        <div id="stats-search-results" class="search-results"></div>
      </article>

      <div class="kpis" aria-label="Today at a glance">
        <div class="kpi-tile">
          <span class="kpi-label">Flights today</span>
          <span class="kpi-num" id="stats-total">&mdash;</span>
          <span class="kpi-sub" id="kpi-today-vs">&nbsp;</span>
        </div>
        <div class="kpi-tile">
          <span class="kpi-label">Unique aircraft today</span>
          <span class="kpi-num" id="kpi-unique">&mdash;</span>
          <span class="kpi-sub">distinct tail numbers</span>
        </div>
        <div class="kpi-tile">
          <span class="kpi-label">7-day average</span>
          <span class="kpi-num" id="kpi-avg7">&mdash;</span>
          <span class="kpi-sub" id="kpi-avg7-sub">flights per day</span>
        </div>
        <div class="kpi-tile">
          <span class="kpi-label">Paid lookups today</span>
          <span class="kpi-num" id="kpi-calls">&mdash;</span>
          <span class="kpi-sub" id="stats-api-calls">&nbsp;</span>
        </div>
      </div>

      <div class="grid grid-feature">
        <article class="card" aria-labelledby="recent-h">
          <header class="card-head"><div><h2 id="recent-h">Recent flights</h2><p>Newest first, refreshed every minute</p></div></header>
          <div id="recent-flights-list"><p class="empty">Loading&hellip;</p></div>
        </article>
        <article class="card" aria-labelledby="stats-today-heading">
          <header class="card-head"><div><h2 id="stats-today-heading">Today by hour</h2><p id="today-peak">&nbsp;</p></div></header>
          <div class="bar-chart bar-chart-hours" id="today-hours" role="img" aria-label="Flights per hour today"></div>
          <h3 class="subhead">Top airlines today</h3>
          <div class="rank-list" id="stats-top"></div>
        </article>
      </div>

      <article class="card" id="period-card" aria-labelledby="period-title">
        <header class="card-head card-head-wrap">
          <div><h2 id="period-title">Last 90 days</h2><p id="period-range">&nbsp;</p></div>
          <div class="period-controls">
            <div class="segmented" role="group" aria-label="Quick date ranges" id="period-presets">
              <button type="button" class="seg" data-action="period" data-preset="yesterday" aria-pressed="false">Yesterday</button>
              <button type="button" class="seg" data-action="period" data-preset="7d" aria-pressed="false">7d</button>
              <button type="button" class="seg" data-action="period" data-preset="30d" aria-pressed="false">30d</button>
              <button type="button" class="seg" data-action="period" data-preset="90d" aria-pressed="true">90d</button>
            </div>
            <form class="date-range" data-submit="period-apply">
              <label class="sr-only" for="period-from">From</label>
              <input type="date" id="period-from" data-change="period-dirty">
              <span class="date-sep" aria-hidden="true">to</span>
              <label class="sr-only" for="period-to">To</label>
              <input type="date" id="period-to" data-change="period-dirty">
              <button type="submit" class="btn btn-primary btn-sm" id="period-apply-btn" hidden>Apply</button>
            </form>
          </div>
        </header>

        <div class="period-body" id="period-body">
          <div class="period-kpis">
            <div><span class="pk-num" id="period-total">&mdash;</span><span class="pk-label">flights</span></div>
            <div><span class="pk-num" id="period-avg">&mdash;</span><span class="pk-label">per day</span></div>
            <div><span class="pk-num" id="period-busiest">&mdash;</span><span class="pk-label" id="period-busiest-label">busiest day</span></div>
            <div><span class="pk-num" id="period-unique">&mdash;</span><span class="pk-label">unique aircraft</span></div>
            <div><span class="pk-num" id="period-calls">&mdash;</span><span class="pk-label" id="period-api-calls">paid lookups</span></div>
          </div>

          <div class="bar-chart bar-chart-days" id="day-chart" role="img" aria-label="Flights per day"></div>
          <p class="chart-legend"><span class="lg-bar" aria-hidden="true"></span>Flights per day<span class="lg-avg"><span class="lg-line" aria-hidden="true"></span>7-day average</span></p>

          <div class="rollups">
            <div class="rollup"><h3 class="subhead">Top airlines</h3><div class="rank-list" id="rollup-airlines"></div></div>
            <div class="rollup"><h3 class="subhead">Top tail numbers</h3><div class="rank-list" id="rollup-tails"></div></div>
            <div class="rollup"><h3 class="subhead">Top routes</h3><div class="rank-list" id="rollup-routes"></div></div>
            <div class="rollup"><h3 class="subhead">Top aircraft types</h3><div class="rank-list" id="rollup-types"></div></div>
          </div>

          <div class="rollups rollups-2">
            <div class="rollup"><h3 class="subhead">Busiest hours <span class="label-note" id="period-peak"></span></h3><div class="bar-chart bar-chart-hours" id="period-hours" role="img" aria-label="Flights per hour of the day"></div></div>
            <div class="rollup"><h3 class="subhead">Where routes came from</h3><div id="rollup-sources"></div></div>
          </div>

          <details class="explain daily-table">
            <summary>Daily table</summary>
            <div class="history" id="stats-history"></div>
          </details>
        </div>
      </article>

      <div class="grid grid-2">
        <article class="card" id="free-api-card">
          <header class="card-head"><div><h2>Free API accuracy</h2><p>adsbdb vs. paid APIs &middot; commercial flights</p></div></header>
          <div id="free-api-content"><p class="empty">Loading&hellip;</p></div>
        </article>
        <article class="card" id="ga-accuracy-card">
          <header class="card-head"><div><h2>GA free API accuracy</h2><p>adsbdb and OpenSky vs. FR24 &middot; N-number aircraft</p></div></header>
          <div id="ga-accuracy-content"><p class="empty">Loading&hellip;</p></div>
        </article>
      </div>
    </div>
  </section>

  <!-- ═════════════════════════════ RULES ═════════════════════════════ -->
  <section class="panel" id="rules-tab" data-panel="rules" aria-labelledby="rules-title" hidden>
    <div class="page">
      <div class="page-head">
        <h1 class="page-title" id="rules-title">Rules</h1>
        <p class="page-sub">Test a lookup end to end, and pin routes the APIs get wrong.</p>
      </div>

      <article class="card" aria-labelledby="test-h">
        <header class="card-head">
          <div><h2 id="test-h">Test a flight lookup</h2><p>Runs the full live pipeline for a callsign or tail number, with the same trust rules and LOCAL_AIRPORTS filter as a real flight. The result shows on the matrix for 30 seconds; its log lines are tagged <code>[TEST:]</code>.</p></div>
        </header>
        <form class="test-form" data-submit="test-flight">
          <label class="sr-only" for="test-callsign">Callsign or tail number</label>
          <input type="text" id="test-callsign" class="upper mono" placeholder="MXY527, SWA1234, N530JL" maxlength="20" autocapitalize="characters" spellcheck="false" autocomplete="off" enterkeyhint="go">
          <label class="check"><input type="checkbox" id="test-use-cache" checked> Use cached data</label>
          <div class="test-actions">
            <button type="submit" class="btn btn-primary" id="test-run-btn">{{ ico('play') }}<span>Run test</span></button>
            <button type="button" class="btn btn-secondary" id="test-clear-btn" data-action="test-clear" hidden>{{ ico('x') }}Clear display</button>
            <button type="button" class="btn btn-ghost" id="test-reset-btn" data-action="test-reset" hidden>{{ ico('reset') }}Reset</button>
          </div>
        </form>
        <details class="explain">
          <summary>What "Use cached data" changes</summary>
          <p>Checked, the test calls the real <code>get_route()</code> and <code>get_aircraft_type()</code>, cache reads included, exactly as a live flight would. Unchecked, it skips the cache and asks every API fresh.</p>
        </details>
        <div id="test-result" class="test-result" hidden></div>
      </article>

      <article class="card" aria-labelledby="rules-h">
        <header class="card-head">
          <div><h2 id="rules-h">Override rules <span class="count-badge" id="rules-count"></span></h2><p>A matching callsign or tail skips every API lookup and uses the route below, saving AirLabs and FlightAware quota.</p></div>
          <span id="rules-save-status" class="save-status" role="status" aria-live="polite"></span>
        </header>
        <div id="rules-table-wrap"><p class="empty">Loading&hellip;</p></div>
        <details class="explain">
          <summary>Pattern tips</summary>
          <p><code>*</code> matches any characters: <code>JANET*</code> matches JANET42 and JANET99; <code>N9*WY</code> matches N911WY and N9WY. Leave the origin or destination blank if it's unknown and the display shows <code>?</code>. Rules are checked top to bottom.</p>
        </details>
      </article>

      <article class="card" aria-labelledby="add-rule-h">
        <header class="card-head"><div><h2 id="add-rule-h">Add a rule</h2></div></header>
        <form id="rule-form" data-submit="add-rule" autocomplete="off">
          <div class="fields fields-3">
            <div class="field">
              <label for="rule-pattern">Pattern <span class="req" aria-hidden="true">*</span></label>
              <input type="text" id="rule-pattern" class="upper mono" placeholder="JANET* or N911WY" autocapitalize="characters" spellcheck="false" required aria-describedby="rule-pattern-hint">
              <p class="hint" id="rule-pattern-hint">Callsign or tail number; * matches anything</p>
            </div>
            <div class="field">
              <label for="rule-origin">Origin <span class="label-note">optional</span></label>
              <input type="text" id="rule-origin" class="upper mono" placeholder="LAS" maxlength="4" autocapitalize="characters" spellcheck="false">
            </div>
            <div class="field">
              <label for="rule-dest">Destination <span class="label-note">optional</span></label>
              <input type="text" id="rule-dest" class="upper mono" placeholder="&mdash;" maxlength="4" autocapitalize="characters" spellcheck="false">
            </div>
            <div class="field">
              <label for="rule-display">Display name <span class="label-note">optional</span></label>
              <input type="text" id="rule-display" placeholder="LVMPD AIR 2" aria-describedby="rule-display-hint">
              <p class="hint" id="rule-display-hint">Shown on the display; the real type is still logged</p>
            </div>
            <div class="field">
              <label for="rule-plane">Type override <span class="label-note">optional</span></label>
              <input type="text" id="rule-plane" placeholder="AIRBUS A220-300" aria-describedby="rule-plane-hint">
              <p class="hint" id="rule-plane-hint">Leave blank to let the APIs fill it in</p>
            </div>
            <div class="field">
              <label for="rule-note">Note <span class="label-note">optional</span></label>
              <input type="text" id="rule-note" placeholder="Janet Airlines, classified destination">
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">{{ ico('plus') }}Add rule</button>
          </div>
        </form>
      </article>
    </div>
  </section>

  <!-- ═════════════════════════════ LOG ═════════════════════════════ -->
  <section class="panel panel-full" id="log-tab" data-panel="log" aria-label="Live log" hidden>
    <div class="log-toolbar">
      <span class="chip" id="log-status" data-state="offline"><span class="chip-dot" aria-hidden="true"></span><span id="log-status-text">Offline</span></span>
      <label class="sr-only" for="log-filter">Filter log lines</label>
      <input type="search" id="log-filter" class="log-filter" placeholder="Filter" autocomplete="off" spellcheck="false" data-input="log-filter">
      <label class="switch-field switch-sm">
        <input type="checkbox" role="switch" id="autoscroll" checked>
        <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
        <span>Auto-scroll</span>
      </label>
      <span class="log-stats" id="log-stats">0 lines</span>
      <button type="button" class="btn btn-ghost btn-sm" data-action="log-clear">{{ ico('trash') }}Clear</button>
    </div>
    <div id="log-output" role="log" aria-label="Log output" tabindex="0"></div>
  </section>

</main>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
